name: CI

on:
  push:
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-unknown-unknown -p nekoc-wasm -- -D warnings
      # The CLI must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --locked --version "$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
      - run: npm ci --ignore-scripts
      - run: node packages/nekoc/build.mjs
      - run: npm --prefix packages/nekoc test
      - run: node tools/build-pages.mjs dist/pages
      - run: node tools/build-extension.mjs dist/pickcat-rust
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 部分工具测试用 git show 读取冻结的历史基线，需要完整历史
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm run typecheck
      - run: npm run test:tools
      - run: npm audit --audit-level=moderate
