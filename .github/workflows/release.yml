name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin nekoc --bin web
      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: node tools/package-release.mjs ${{ matrix.target }} target/${{ matrix.target }}/release
      # Every runner is native, so each package is smoke tested on its own platform.
      - name: Smoke test the package outside the checkout
        shell: bash
        run: |
          for archive in dist/releases/*.zip dist/releases/*.tar.gz; do
            if [ -f "$archive" ]; then node tools/smoke-release.mjs "$archive"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/releases/*.zip
            dist/releases/*.tar.gz
          if-no-files-found: error

  collect:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/releases
      - run: node tools/package-release.mjs --checksums dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: dist/releases/*
      - name: Create a draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
