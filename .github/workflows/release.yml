name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The full package also carries the browser extension and showcase works.
      - uses: actions/checkout@v4
        with:
          repository: NekoX-Lab/nekoc-works
          path: works-src
      - uses: actions/download-artifact@v4
        with:
          name: extension-dir
          path: dist/extension
      - run: npm ci --ignore-scripts
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin nekoc --bin web
      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: node tools/package-release.mjs ${{ matrix.target }} target/${{ matrix.target }}/release
        env:
          NEKOC_EXTENSION_DIR: dist/extension
          NEKOC_WORKS_DIR: works-src
      # Every runner is native, so each package is smoke tested on its own platform.
      - name: Smoke test the package outside the checkout
        shell: bash
        env:
          NEKOC_SMOKE_FULL: '1'
        run: |
          for archive in dist/releases/*.zip dist/releases/*.tar.gz; do
            if [ -f "$archive" ]; then node tools/smoke-release.mjs "$archive"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/releases/*.zip
            dist/releases/*.tar.gz
          if-no-files-found: error

  # Platform independent: the @fttawa/nekoc npm tarball and the browser extension.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The CLI must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --locked --version "$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
      - run: npm ci --ignore-scripts
      - run: node packages/nekoc/build.mjs
      - run: npm --prefix packages/nekoc test
      - name: Pack the npm package and the extension
        run: |
          mkdir -p dist/releases
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then version="$(node -p 'require("./packages/nekoc/package.json").version')"; fi
          (cd packages/nekoc && npm pack --ignore-scripts --pack-destination ../../dist/releases)
          node tools/build-extension.mjs dist/pickcat-rust
          (cd dist/pickcat-rust && zip -qr "../releases/nekoc-pickcat-extension-${version}.zip" .)
      # Install the tarball the way a user would (outside the checkout) and compile a sample.
      - name: Smoke test the npm package
        run: |
          smoke="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$smoke" && cp samples/stage_demo.nk.ts "$smoke/"
          cd "$smoke" && npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/dist/releases/*.tgz
          npx nekoc check stage_demo.nk.ts
          npx nekoc build stage_demo.nk.ts -o stage_demo.bcmkn
          npx nekoc run stage_demo.bcmkn --frames 120 | grep -q "cat done"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dir
          path: dist/pickcat-rust
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: |
            dist/releases/*.tgz
            dist/releases/*.zip
          if-no-files-found: error

  collect:
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/releases
      - run: node tools/package-release.mjs --checksums dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: dist/releases/*
      - name: Create a draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Hand-written notes in docs/releases/<tag>.md, with the PR list appended.
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/releases/* --draft --verify-tag --title "NekoC $GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/releases/* --draft --verify-tag --title "NekoC $GITHUB_REF_NAME" --generate-notes
          fi
