[package]
name = "nekoc"
version = "0.2.0"
edition = "2024"
default-run = "nekoc"

[features]
default = []
desktop = ["dep:wry", "dep:tao"]
studio = ["dep:eframe", "dep:egui_extras", "dep:base64", "dep:percent-encoding", "dep:image"]

[[bin]]
name = "nekoc-studio"
path = "src/bin/studio.rs"
required-features = ["studio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "7"
notify-debouncer-mini = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth", "preserve_order"] }
serde_stacker = "0.1"
stacker = "0.1"
sha2 = "0.10"
regex = "1"
rapier2d-f64 = { version = "0.22", default-features = false, features = ["dim2", "f64"] }
ryu-js = "1"
tempfile = "3"
tiny_http = "0.12"
socket2 = "0.6"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33.3", optional = true, features = ["file", "http", "image", "svg"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }
cranelift-codegen = "0.132.3"
cranelift-frontend = "0.132.3"
cranelift-jit = "0.132.3"
cranelift-module = "0.132.3"
cranelift-native = "0.132.3"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

[dev-dependencies]
cranelift-codegen = { version = "0.132.3", features = ["arm64"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
