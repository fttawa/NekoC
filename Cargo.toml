[package]
name = "nekoc"
version = "0.1.0"
edition = "2024"
default-run = "nekoc"

[features]
default = []
studio = ["dep:eframe", "dep:egui_extras", "dep:base64", "dep:percent-encoding", "dep:image"]

[[bin]]
name = "nekoc-studio"
path = "src/bin/studio.rs"
required-features = ["studio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "7"
notify-debouncer-mini = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
tempfile = "3"
tiny_http = "0.12"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33.3", optional = true, features = ["file", "http", "image", "svg"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
