<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="NekoC：用 TypeScript 写 Kitten 积木作品">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1621"/>
      <stop offset="1" stop-color="#16243a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#24344a"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)" opacity="0.7"/>

  <!-- Title -->
  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="80" y="170" font-size="104" font-weight="800" fill="#e8f1fb" letter-spacing="-2">Neko<tspan fill="#6ee7c8">C</tspan></text>
    <text x="84" y="226" font-size="30" font-weight="600" fill="#e8f1fb">用 TypeScript 写 Kitten 积木作品</text>
    <text x="84" y="268" font-size="20" fill="#8aa0b6">编译成官方能打开的 .bcmkn / .bcm · Rust 虚拟机播放</text>
    <!-- Pills -->
    <g font-size="17" font-weight="600">
      <rect x="84" y="300" width="132" height="40" rx="20" fill="#172331" stroke="#24344a"/>
      <text x="150" y="326" text-anchor="middle" fill="#6ee7c8">TypeScript</text>
      <rect x="228" y="300" width="112" height="40" rx="20" fill="#172331" stroke="#24344a"/>
      <text x="284" y="326" text-anchor="middle" fill="#ffb86b">Kitten N</text>
      <rect x="352" y="300" width="112" height="40" rx="20" fill="#172331" stroke="#24344a"/>
      <text x="408" y="326" text-anchor="middle" fill="#7cb7ff">Kitten 4</text>
      <rect x="476" y="300" width="84" height="40" rx="20" fill="#172331" stroke="#24344a"/>
      <text x="518" y="326" text-anchor="middle" fill="#f78fb3">Rust</text>
    </g>
  </g>

  <!-- Code card -->
  <g transform="translate(760 64)">
    <rect width="440" height="132" rx="18" fill="#172331" stroke="#24344a"/>
    <circle cx="24" cy="24" r="6" fill="#f78fb3"/>
    <circle cx="44" cy="24" r="6" fill="#ffb86b"/>
    <circle cx="64" cy="24" r="6" fill="#6ee7c8"/>
    <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="18">
      <text x="24" y="66" fill="#7cb7ff">onStart<tspan fill="#e8f1fb">(() =&gt; {</tspan></text>
      <text x="48" y="92" fill="#e8f1fb"><tspan fill="#ffb86b">say</tspan>(<tspan fill="#6ee7c8">"你好，小猫"</tspan>);</text>
      <text x="24" y="118" fill="#e8f1fb">});</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(980 206)">
    <path d="M0 0 v26" stroke="#5d7189" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 18 L0 30 L10 18" fill="none" stroke="#5d7189" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Blocks -->
  <g transform="translate(760 252)" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="600">
    <rect x="0" y="0" width="230" height="46" rx="16" fill="#ffab19"/>
    <text x="20" y="30" fill="#ffffff">当开始被点击</text>
    <rect x="0" y="50" width="300" height="46" rx="12" fill="#9966ff"/>
    <text x="20" y="80" fill="#ffffff">说</text>
    <rect x="56" y="60" width="140" height="26" rx="13" fill="#ffffff"/>
    <text x="126" y="79" text-anchor="middle" fill="#4c2a99">你好，小猫</text>
  </g>
</svg>
