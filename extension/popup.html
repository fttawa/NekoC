<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>Neko Rust</title></head><body>
<h1>Neko <span>RUST PLAYER</span></h1><p>用本机 Rust 运行 PICKCAT 的 Kitten N 作品</p>
<label class="switch"><input type="checkbox" id="enabled" checked> 自动替换网页播放器</label>
<label class="port">本机端口 <input type="number" id="port" min="1" max="65535" value="4173"></label>
<button id="save">保存并检查连接</button><p id="status" role="status">检查后端…</p>
<div class="help">先运行 <code>start-rust-backend.cmd</code>。<br>支持作品页和论坛帖子内嵌播放器，原播放器出现后自动接管。播放器右上角可切回原版。</div>
<script src="popup.js" type="module"></script></body></html>
