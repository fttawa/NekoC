<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neko Studio</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar tile"><a class="brand" href="/" aria-label="Neko Studio"><span class="mark">n</span><span>neko <b class="brand-sub">STUDIO</b></span></a><div class="project-title"><input id="project-name" aria-label="项目名称"><span id="dirty">本地项目</span></div><div class="top-actions"><span class="engine-chip"><i></i>Rust 引擎</span><a class="ghost" href="/play" target="_blank" rel="noopener" title="打开纯播放器">▷ 游玩</a><button id="save" class="ghost">导出 .bcmkn ↗</button><button id="save-packed" class="ghost" title="把体积大的文本列表压缩，作品启动时用积木自动解压（官方播放器也能运行）">压缩导出</button><button id="open" class="primary" title="选择 Kitten4 .bcm 或 Kitten N .bcmkn 文件，也可以直接拖入窗口">导入 .bcm / .bcmkn</button><input type="file" id="file" accept=".bcm,.bcmkn,.json" hidden></div></header>
<main class="bento">
<aside class="library">
  <section class="tile resources"><div class="section-head"><h2>项目资源</h2><span id="project-version" class="small-tag">0.27.4</span></div><div class="eyebrow">场景</div><div id="scenes"></div><div class="eyebrow">角色</div><div id="sprites"></div></section>
  <section class="tile block-library"><div class="section-head"><h2>积木库</h2></div><input id="search" class="search" placeholder="搜索积木…" aria-label="搜索积木"><div class="category-pills"><span class="chosen">全部</span><span>事件</span><span>动作</span><span>画笔</span></div><div id="palette"></div></section>
</aside>
<section class="workspace tile"><div class="workspace-bar"><div class="tabs"><button class="tab active" data-tab="blocks">积木编排</button><button class="tab" data-tab="json">项目源码</button></div><div class="workspace-tools"><button id="undo" title="撤销">↶</button><button id="redo" title="重做">↷</button><span></span><button id="deselect">取消选择</button></div></div><div class="workspace-context"><div><span class="eyebrow">工作区</span><h1 id="owner-name">画笔</h1></div><span class="context-note">选择积木后可追加指令</span></div><div id="blocks" class="block-canvas"></div><div id="json-panel" hidden><p id="json-note" class="context-note">内部规范 KN JSON</p><textarea id="json-source" spellcheck="false" aria-label="内部规范项目 JSON" aria-describedby="json-note"></textarea><button class="primary" id="apply-json">应用更改</button></div><div class="workspace-footer"><span><i class="status-dot"></i><span id="compile-status">等待编译</span></span><span id="instruction-count">BYTECODE VM</span></div></section>
<aside class="preview">
  <section class="tile stage-tile"><div class="stage-heading"><h2>舞台</h2><span id="stage-size"></span></div><div class="stage-wrap"><canvas id="stage" tabindex="0" aria-label="舞台预览"></canvas><div class="stage-badge">WebGL 2</div></div><div class="transport"><div><button id="run" class="primary"><span>▶</span> 运行</button><button id="pause" class="icon-button" title="暂停" aria-label="暂停">Ⅱ</button><button id="stop" class="icon-button" title="停止" aria-label="停止">■</button><button id="step" class="ghost">单步 →</button></div><span id="runtime-state"><i></i>就绪</span></div></section>
  <section class="tile performance"><div class="section-head"><h2>性能</h2><span class="small-tag" id="transport-kind">WEBSOCKET</span></div><div class="metrics"><div><label>执行耗时</label><strong id="vm-time">—</strong><small>ms / 帧</small></div><div><label>渲染提交</label><strong id="render-time">—</strong><small>CPU ms / 帧</small></div><div><label>运行更新</label><strong id="fps">—</strong><small>次 / 秒</small></div></div><canvas id="chart" width="440" height="52"></canvas><div class="perf-detail"><span>指令 <b id="ops">0</b></span><span>传输 <b id="bytes">0 B</b></span><span>绘制 <b id="draws">0</b></span><span>往返 <b id="roundtrip">—</b></span><span>解码 <b id="decode-time">—</b></span><span>GPU <b id="gpu-time">—</b></span></div><p class="perf-note">统计收到并提交的运行更新，不等于作品画面 FPS；GPU 时间异步采样。</p></section>
  <section class="tile inspector"><div class="section-head"><h2>角色属性</h2><span id="actor-badge" class="small-tag">SPRITE</span></div><div id="properties"></div></section>
  <section class="tile console"><div class="section-head"><h2>运行日志</h2><button id="clear-console" class="ghost small">清空</button></div><div id="logs"><p class="muted">编译诊断与运行输出将显示在这里。</p></div></section>
</aside>
</main><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
